name: Release Go Wrappers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: |
          # Skip tests that require TSS libraries on CI
          go build ./...

      - name: Package Linux amd64 libraries
        run: |
          cd includes
          tar -czvf ../go-wrappers-linux-amd64.tar.gz linux-amd64/ go-dkls.h go-schnorr.h
          echo "Created go-wrappers-linux-amd64.tar.gz"

      - name: Package Linux arm64 libraries
        run: |
          cd includes
          tar -czvf ../go-wrappers-linux-arm64.tar.gz linux-arm64/ go-dkls.h go-schnorr.h
          echo "Created go-wrappers-linux-arm64.tar.gz"

      - name: Package Darwin libraries
        run: |
          cd includes
          tar -czvf ../go-wrappers-darwin-arm64.tar.gz darwin/ go-dkls.h go-schnorr.h
          echo "Created go-wrappers-darwin-arm64.tar.gz"

      - name: Package mobile Android libraries
        run: |
          if ls mobile/android/*.aar 1>/dev/null 2>&1; then
            tar -czvf go-wrappers-mobile-android.tar.gz -C mobile/android .
            echo "Created go-wrappers-mobile-android.tar.gz"
          else
            echo "No Android .aar files found in mobile/android/ — skipping"
          fi

      - name: Package mobile iOS libraries
        run: |
          if ls mobile/ios/*.xcframework 1>/dev/null 2>&1; then
            tar -czvf go-wrappers-mobile-ios.tar.gz -C mobile/ios .
            echo "Created go-wrappers-mobile-ios.tar.gz"
          else
            echo "No iOS .xcframework bundles found in mobile/ios/ — skipping"
          fi

      - name: Upload Release Assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            go-wrappers-linux-amd64.tar.gz
            go-wrappers-linux-arm64.tar.gz
            go-wrappers-darwin-arm64.tar.gz
          )
          # Include mobile assets if they were built
          [ -f go-wrappers-mobile-android.tar.gz ] && ASSETS+=(go-wrappers-mobile-android.tar.gz)
          [ -f go-wrappers-mobile-ios.tar.gz ] && ASSETS+=(go-wrappers-mobile-ios.tar.gz)
          gh release upload ${{ github.event.release.tag_name }} \
            "${ASSETS[@]}" \
            --clobber

      - name: Upload Assets (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            go-wrappers-linux-amd64.tar.gz
            go-wrappers-linux-arm64.tar.gz
            go-wrappers-darwin-arm64.tar.gz
          )
          [ -f go-wrappers-mobile-android.tar.gz ] && ASSETS+=(go-wrappers-mobile-android.tar.gz)
          [ -f go-wrappers-mobile-ios.tar.gz ] && ASSETS+=(go-wrappers-mobile-ios.tar.gz)
          # Create release if it doesn't exist
          gh release create ${{ inputs.tag }} \
            "${ASSETS[@]}" \
            --title "Go Wrappers ${{ inputs.tag }}" \
            --notes "Pre-compiled TSS libraries for Go.

## Platform Support

| Platform | Architecture | Status |
|----------|-------------|--------|
| Linux | amd64 (x86_64) | ✅ Supported |
| Linux | arm64 (aarch64) | ✅ Supported |
| macOS | arm64 (Apple Silicon) | ✅ Supported |
| macOS | amd64 (Intel) | ❌ Not yet available |
| Android | arm64/armv7 | ✅ Available (if mobile build exists) |
| iOS | arm64 | ✅ Available (if mobile build exists) |

## Usage

Download the appropriate archive for your platform and extract to your project or system library path.

\`\`\`bash
# Linux amd64
tar -xzf go-wrappers-linux-amd64.tar.gz -C /usr/local/lib/dkls

# Linux arm64
tar -xzf go-wrappers-linux-arm64.tar.gz -C /usr/local/lib/dkls

# macOS arm64
tar -xzf go-wrappers-darwin-arm64.tar.gz -C /usr/local/lib/dkls
\`\`\`
" \
            || gh release upload ${{ inputs.tag }} \
              "${ASSETS[@]}" \
              --clobber
